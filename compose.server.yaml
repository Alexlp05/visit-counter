# Ce qui change sur le serveur (en plus de compose.yaml) :
#   docker compose -f compose.yaml -f compose.server.yaml up -d --build
#
# Aucun port publié : le site et l'API ne sont joignables qu'à travers le Caddy
# du serveur (dossier caddy/, à côté des projets), sur le port 8443, via le
# réseau Docker "web".
services:
  site:
    ports: !reset []
    restart: unless-stopped
    networks:
      web:
        aliases:
          - counter-site
  api:
    ports: !reset []
    restart: unless-stopped
    networks:
      default: # pour joindre la base
      web:
        aliases:
          - counter-api
  db:
    restart: unless-stopped

networks:
  web:
    external: true
